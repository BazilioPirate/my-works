# Конфиг nginx ВНУТРИ контейнера (обслуживает статику на порту 80).
# Не путать с проксирующим конфигом хоста в DEPLOY.md.
server {
    listen 80;
    server_name _;

    root /usr/share/nginx/html;
    index index.html;

    gzip on;
    gzip_types text/css application/javascript application/json text/plain image/svg+xml;
    gzip_min_length 512;

    location / {
        try_files $uri $uri/ /index.html;
    }

    location ~* \.(?:css|js|json|png|jpg|jpeg|webp|svg|ico)$ {
        expires 7d;
        add_header Cache-Control "public";
    }

    location = /manifest.json {
        add_header Content-Type application/manifest+json;
    }
}
